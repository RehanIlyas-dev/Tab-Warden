<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tab Warden</title>
    <link rel="stylesheet" href="/src/popup/style.css" />
  </head>
  <body>
    <header class="bar">
      <h1>Tab Warden</h1>
      <button id="open-options" class="link" type="button">Options</button>
    </header>

    <section class="stats" id="stats"></section>

    <section class="block">
      <div class="block-head">
        <h2>Duplicate tabs</h2>
        <button id="close-duplicates" class="primary" type="button" disabled>Close duplicates</button>
      </div>
      <div id="duplicates" class="list"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>Heaviest tabs</h2>
        <span class="hint" id="ranking-hint"></span>
      </div>
      <div id="heavy" class="list"></div>
    </section>

    <footer class="bar">
      <span id="summary" class="hint"></span>
    </footer>

    <script type="module" src="/src/popup/main.js"></script>
  </body>
</html>
