<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tab Warden</title>
    <link rel="stylesheet" href="/src/popup/style.css" />
  </head>
  <body>
    <div class="popup-shell">
      <header class="bar">
        <h1>Tab Warden</h1>
        <button id="open-options" class="link" type="button">Options</button>
      </header>

      <div class="popup-scroll">
        <section class="stats" id="stats"></section>

        <section class="block">
          <div class="block-head">
            <h2>Duplicate tabs</h2>
            <button id="close-duplicates" class="primary" type="button" disabled>
              Close duplicates
            </button>
          </div>
          <div id="confirm-bar" class="confirm" hidden>
            <span id="confirm-text" class="hint confirm-text"></span>
            <button id="confirm-no" type="button">Cancel</button>
          </div>
          <div id="duplicates" class="list"></div>
        </section>

        <section class="block">
          <div class="block-head">
            <h2>Heaviest tabs</h2>
            <button id="free-memory" class="primary" type="button" disabled>
              Free up memory
            </button>
          </div>
          <div id="confirm-bar-free" class="confirm" hidden>
            <span id="confirm-text-free" class="hint confirm-text"></span>
            <button id="confirm-no-free" type="button">Cancel</button>
          </div>
          <div id="heaviest" class="list"></div>
          <p class="hint note">
            An estimate, not a memory reading. Unloading frees a tab until you click it, and
            any unsaved form on that page is lost.
          </p>
        </section>

        <section class="block">
          <div class="block-head">
            <h2>All tabs</h2>
          </div>
          <div id="all-tabs" class="list"></div>
        </section>
      </div>

      <footer class="bar">
        <span id="summary" class="hint"></span>
      </footer>
    </div>

    <script type="module" src="/src/popup/main.js"></script>
  </body>
</html>
