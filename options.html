<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tab Warden options</title>
    <link rel="stylesheet" href="/src/popup/style.css" />
  </head>
  <body class="options">
    <header class="bar">
      <h1>Tab Warden options</h1>
    </header>

    <section class="block">
      <h2>Duplicate detection</h2>
      <label class="row">
        <input type="checkbox" id="ignore-pinned" />
        <span>Keep pinned tabs when closing duplicates</span>
      </label>
      <label class="row">
        <input type="checkbox" id="confirm-before-closing" />
        <span>Ask before closing tabs</span>
      </label>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>Extension audit</h2>
        <span class="hint">coming soon</span>
      </div>
      <div id="extensions" class="list"></div>
    </section>

    <script type="module" src="/src/options/main.js"></script>
  </body>
</html>
