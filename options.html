<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tab Warden options</title>
    <link rel="stylesheet" href="/src/popup/style.css" />
  </head>
  <body class="options">
    <header class="bar">
      <h1>Tab Warden options</h1>
    </header>

    <section class="block">
      <h2>Duplicate detection</h2>
      <label class="row">
        <input type="checkbox" id="ignore-pinned" />
        <span>Keep pinned tabs when closing or unloading</span>
      </label>
      <label class="row">
        <input type="checkbox" id="confirm-before-closing" />
        <span>Ask before closing tabs</span>
      </label>
    </section>

    <section class="block">
      <h2>Freeing memory</h2>
      <label class="row">
        <input type="checkbox" id="skip-audible" />
        <span>Keep tabs that are playing audio</span>
      </label>
      <label class="row">
        <input type="number" id="stale-days" min="1" max="365" step="1" />
        <span>Days before an unused tab counts as stale</span>
      </label>
      <label class="row">
        <input type="checkbox" id="auto-free" />
        <span>Unload idle tabs once a day on their own</span>
      </label>
      <p class="hint">
        The daily run uses the same rules as Free up memory. Pinned tabs and tabs
        playing audio are kept, and a tab you are looking at is never touched.
      </p>
      <p id="options-status" class="hint"></p>
    </section>

    <script type="module" src="/src/options/main.js"></script>
  </body>
</html>
